name: 🐛 Bug report
description: Report a reproducible bug or regression in Pixel Tracker Android SDK
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        # Bug report

        👋 Hi!

        Thank you for helping us improve the Pixel Tracker Android SDK!

        **Please fill the following carefully before opening a new issue ❗**
        *(Your issue may be closed if it doesn't provide the required information.)*

  - type: checkboxes
    attributes:
      label: Before submitting a new issue
      description: Please perform the following checks first.
      options:
        - label: I tested using the latest version of the SDK, as the bug may already be fixed.
          required: true

        - label: I tested on a supported Android version (API 21+).
          required: true

        - label: I searched for existing issues and confirmed this is not a duplicate.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: |
        Provide a clear and concise description of the issue.

        You may also include:
        - error messages
        - stack traces
        - screenshots
        - screen recordings
      placeholder: |
        Example:
        When I attach a pixel with visibilityThreshold = 50,
        the onAppearance callback is never triggered.
    validations:
      required: true

  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: What version of the Pixel Tracker SDK are you using?
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android OS version
      description: What Android version are you experiencing the issue on?
      placeholder: "e.g. Android 14 (API 34)"
    validations:
      required: true

  - type: input
    id: device-info
    attributes:
      label: Device / Emulator info
      description: What device or emulator are you using?
      placeholder: "e.g. Pixel 7 Pro, Samsung Galaxy S23, Emulator API 33"
    validations:
      required: true

  - type: textarea
    id: environment-info
    attributes:
      label: Environment info
      description: Paste your environment information here.
      render: shell
      value: |
        # Gradle version
        ./gradlew --version

        # Kotlin version
        # Check your build.gradle.kts

        # Android Gradle Plugin version
        # Check your build.gradle.kts
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: |
        Provide a clear list of steps and enough code to reproduce the issue.
      value: |
        1. Initialize the SDK:
           ```kotlin
           PixelTracker.initialize("https://...", true)
           ```

        2. Create a PixelConfig:
           ```kotlin
           PixelConfig(
               pixelId = "test_pixel",
               refreshTimeSeconds = 30,
               pixelSize = 1,
               visibilityThreshold = 1
           )
           ```

        3. Attach the pixel:
           ```kotlin
           PixelTracker.attach(...)
           ```

        4. Start tracking:
           ```kotlin
           pixelTracker.start()
           ```
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: |
        The onAppearance callback should be triggered when the pixel becomes visible.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened?
      placeholder: |
        The onAppearance callback is never called and totalAppearances remains 0.
    validations:
      required: true

  - type: input
    id: reproducible-example
    attributes:
      label: Reproducible example repository
      description: |
        Please provide a GitHub repository with a minimal reproducible example if possible.
      placeholder: "https://github.com/yourusername/pixel-tracker-bug-demo"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant logs here.
      render: shell
      placeholder: |
        2024-01-15 10:30:00.123 D/PixelTracker: SDK initialized
        2024-01-15 10:30:00.456 E/PixelTracker: Failed to send event...
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our Code of Conduct.
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true